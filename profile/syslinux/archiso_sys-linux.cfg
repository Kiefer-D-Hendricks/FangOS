LABEL arch
TEXT HELP
Boot the FangOS Live Environment on BIOS.
It allows you to run FangOS or perform system maintenance.
ENDTEXT
MENU LABEL FangOS Live Environment (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n quiet splash

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the FangOS Live Environment on BIOS with speakup screen reader.
It allows you to run FangOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL FangOS Live Environment (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on copytoram=n quiet splash
