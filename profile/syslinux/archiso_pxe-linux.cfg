LABEL arch_nbd
TEXT HELP
Boot the FangOS Live Environment using NBD.
It allows you to run FangOS or perform system maintenance.
ENDTEXT
MENU LABEL FangOS Live Environment (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y copytoram=n
SYSAPPEND 3

