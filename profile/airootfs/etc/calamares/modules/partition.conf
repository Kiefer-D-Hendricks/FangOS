# Partition module configuration for FangOS
---
# Default filesystem for new partitions (btrfs with zstd compression)
defaultFileSystemType: "btrfs"

# Allow these filesystems in the partition UI
availableFileSystemTypes: ["btrfs", "ext4", "xfs", "f2fs", "vfat", "swap", "unformatted"]

# Enable LUKS encryption option in the UI
enableLuks: true
